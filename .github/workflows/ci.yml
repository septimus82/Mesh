name: CI

on:
  # One run per commit (#373): feature branches run through their pull request (the merge result);
  # push runs only where commits land. workflow_dispatch still runs any branch.
  push:
    branches: [main, redesign/visual-editor, 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arcade3-canary:
    name: arcade3-canary (required, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            pytest.ini

      - name: Install dependencies (Arcade 3.x canary)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install "arcade>=3,<4"
          python -m pip show arcade

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Arcade 3.x smoke tests
        run: |
          python -m compileall -q engine mesh_cli tooling tests
          xvfb-run -a python -m pytest -q -W error \
            tests/test_shadow_backend_selection_determinism.py \
            tests/test_render_shadow_mask_fbo_use.py \
            tests/test_shadow_mask_fbo_binding.py \
            tests/test_shadow_shapes.py \
            tests/test_lighting_module_path_resolution.py \
            tests/test_post_processing.py \
            tests/test_mesh_cli_headless_imports.py

      - name: Arcade 3.x runtime replay smoke
        run: |
          mkdir -p artifacts/arcade3_canary
          xvfb-run -a python -m mesh_cli replay-hash \
            --replay replays/00_smoke_dump_state.json \
            --frames 120 \
            --warmup 20 \
            --expect replays/00_smoke_dump_state.hash.json \
            --out artifacts/arcade3_canary/replay_hash.json

      - name: Arcade 3 canary replay summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("artifacts/arcade3_canary/replay_hash.json")
          lines = ["## Arcade 3 canary replay smoke", ""]
          if summary_path.exists():
            try:
              payload = json.loads(summary_path.read_text(encoding="utf-8"))
              replay = str(payload.get("replay", "?"))
              digest = str(payload.get("hash", "?"))
              frames = int(payload.get("frames", 0) or 0)
              warmup = int(payload.get("warmup", 0) or 0)
              lines.append(f"- replay: `{replay}`")
              lines.append(f"- hash: `{digest}`")
              lines.append(f"- frames={frames}, warmup={warmup}")
            except Exception:
              lines.append("- replay hash artifact: unreadable")
          else:
            lines.append("- replay hash artifact: missing")
          lines.append("")
          out = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with out.open("a", encoding="utf-8") as fh:
            fh.write("\n".join(lines))
          PY

      - name: Arcade 3.x installed wheel replay smoke
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv .venv_arcade3_wheel
          source .venv_arcade3_wheel/bin/activate
          python -m pip install -U pip
          python -m pip install dist/*.whl "arcade>=3,<4"
          # -I: from the checkout, a plain `python -m mesh_cli` imported the checkout's engine instead of the wheel's
          # (H5, #422). The replay is checkout content; the code must be the installed wheel's, and is checked to be.
          python -I -c "import sys, engine, mesh_cli; from pathlib import Path; v = Path(sys.prefix).resolve(); bad = [m.__file__ for m in (engine, mesh_cli) if not Path(m.__file__).resolve().is_relative_to(v)]; assert not bad, f'not the installed wheel: {bad}'; print('installed engine:', engine.__file__)"
          xvfb-run -a python -I -m mesh_cli replay-hash \
            --replay replays/00_smoke_dump_state.json \
            --frames 120 \
            --warmup 20 \
            --expect replays/00_smoke_dump_state.hash.json \
            --out artifacts/arcade3_canary/wheel_replay_hash.json

      - name: Upload Arcade 3 canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade3-canary-artifacts
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/arcade3_canary/**

  web-smoke:
    name: web-smoke (required, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            pytest.ini

      - name: Install dependencies (web smoke)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Build web target
        run: |
          python -m mesh_cli build-web --out artifacts/web_build

      - name: Runtime-only smoke (no editor imports)
        run: |
          python -m mesh_cli play-runtime --headless-smoke --smoke-artifact artifacts/runtime_smoke_web_gate.json

      - name: Web structural smoke
        run: |
          python -m mesh_cli web-smoke --build-dir artifacts/web_build --artifact artifacts/web_smoke.json

      - name: Upload web smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-artifacts
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/web_build/**
            artifacts/web_smoke.json
            artifacts/runtime_smoke_web_gate.json

  # Each OS's tests run as two parallel jobs (H3, #422 F13; neither uses the other's results): ``pytest`` (the full
  # default suite) and ``verify`` (verify-all, the release bundle and its strict verification, the artifacts). The
  # ``tests (<os>, py3.11)`` job after them is the result to look at: green only when both of that OS's jobs succeeded.
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # Each OS reports its own result: with fail-fast a Windows failure cancelled Linux (and vice versa) and hid it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      MESH_CI_SEED: "123"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python, the project and a display
        uses: ./.github/actions/mesh-ci-setup
        with:
          python-version: ${{ matrix.python }}

      - name: Compile Python sources
        run: |
          python -m compileall -q engine mesh_cli tooling tests

      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pytest -q -p no:cacheprovider

      - name: Run pytest (Linux)
        if: runner.os != 'Windows'
        run: |
          xvfb-run -a python -m pytest -q

      # What the suite's tests write under artifacts/ (replay diagnostics and the like): before the split it went up
      # with mesh-artifacts, which a failed suite still uploaded. Not a mesh-artifacts-* name: release_draft.yml takes
      # those.
      - name: Upload test outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-outputs-${{ matrix.os }}-py${{ matrix.python }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            artifacts/

  verify:
    name: verify (${{ matrix.os }}, py${{ matrix.python }})
    permissions:
      contents: read
      pull-requests: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # Each OS reports its own result: with fail-fast a Windows failure cancelled Linux (and vice versa) and hid it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      MESH_CI_SEED: "123"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('pyproject.toml', 'tooling/mypy_baseline.txt', 'tooling/mypy_island.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ matrix.python }}-

      - name: Set up Python, the project and a display
        uses: ./.github/actions/mesh-ci-setup
        with:
          python-version: ${{ matrix.python }}

      # Before the split verify-all ran after the full suite, so its timed pytest-fast found the sources compiled and
      # every test module already assertion-rewritten. Cold, that step took ~24 s longer on both OSes (run
      # 41005921959: Ubuntu 100.77 s at speed 1.10, over its 79.05 s threshold) for work its thresholds never measured.
      # These two steps give it the same start as before: compile, then the full run's own collection (no test runs).
      - name: Compile Python sources
        run: |
          python -m compileall -q engine mesh_cli tooling tests

      # Only the summary line is shown, so the exit code is checked here, not left to whatever ran last: a collection
      # that fails is a failed step, with its output.
      - name: Warm pytest's caches (collect only, no test runs)
        run: |
          if ($IsLinux) { $out = xvfb-run -a python -m pytest -q --collect-only }
          else { $out = python -m pytest -q -p no:cacheprovider --collect-only }
          $code = $LASTEXITCODE
          if ($code -ne 0) { $out | Select-Object -Last 80; throw "pytest --collect-only failed with exit code $code" }
          $out | Select-Object -Last 1

      - name: Run verify-all (Windows)
        if: runner.os == 'Windows'
        env:
          MESH_VERIFY_BUDGET_ENFORCE: "1"
        run: |
          python -m mesh_cli verify-all --artifacts artifacts --ci-bundle --release-notes-artifact

      - name: Run verify-all (Linux)
        if: runner.os != 'Windows'
        env:
          MESH_VERIFY_BUDGET_ENFORCE: "1"
        run: |
          xvfb-run -a python -m mesh_cli verify-all --artifacts artifacts --ci-bundle --release-notes-artifact

      - name: Validate artifact bundle
        run: |
          python -m mesh_cli artifacts-validate --artifacts artifacts

      - name: Diff against baseline
        id: diff_against_baseline
        run: |
          python -m mesh_cli artifacts-diff --base tooling/metrics/ci_baseline_artifacts --curr artifacts --fail-on-regression

      - name: Baseline diff markdown artifact
        if: always()
        run: |
          python -m mesh_cli artifacts-diff --base tooling/metrics/ci_baseline_artifacts --curr artifacts --format markdown --out artifacts/baseline_diff.md

      - name: Baseline diff JSON artifact
        if: always()
        run: |
          python -m mesh_cli artifacts-diff --base tooling/metrics/ci_baseline_artifacts --curr artifacts --format json --out artifacts/baseline_diff.json

      - name: Build baseline diff insights (Linux)
        id: baseline_diff_insights
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload_path = Path("artifacts/baseline_diff.json")
          mode = "none"
          improvements = 0
          changed = 0
          informational = 0
          regressions = 0
          items: list[dict[str, object]] = []

          if payload_path.exists():
            try:
              payload = json.loads(payload_path.read_text(encoding="utf-8"))
              if isinstance(payload, dict):
                counts = payload.get("counts", {})
                if isinstance(counts, dict):
                  regressions = int(counts.get("regressions", 0) or 0)
                  improvements = int(counts.get("improvements", 0) or 0)
                  changed = int(counts.get("changed", 0) or 0)
                  informational = int(counts.get("informational", 0) or 0)
                for key in ("improvements", "changed", "informational"):
                  listed = payload.get(key, [])
                  if isinstance(listed, list):
                    items.extend([it for it in listed if isinstance(it, dict)])
            except Exception:
              pass

          if regressions > 0:
            mode = "regression"
          elif improvements > 0 or changed > 0 or informational > 0:
            mode = "delta"
          else:
            mode = "none"

          summary_lines: list[str] = []
          comment_lines: list[str] = []
          if mode == "delta":
            summary_lines.append("## Mesh CI baseline diff")
            summary_lines.append("")
            summary_lines.append(f"No regressions. Improvements: {improvements}, Changed: {changed}, Informational: {informational}")
            summary_lines.append("")
            summary_lines.append("Top changes:")
            summary_lines.append("")
            for item in items[:10]:
              field = str(item.get("field", "?"))
              base = item.get("base", "?")
              current = item.get("current", "?")
              summary_lines.append(f"- `{field}`: `{base}` -> `{current}`")

            comment_lines.append("<!-- mesh-baseline-diff -->")
            comment_lines.append("## Mesh baseline diff (CI)")
            comment_lines.append("")
            comment_lines.append(f"No regressions. Improvements: {improvements}, Changed: {changed}, Informational: {informational}")
            comment_lines.append("")
            comment_lines.append("Top changes:")
            comment_lines.append("")
            for item in items[:10]:
              field = str(item.get("field", "?"))
              base = item.get("base", "?")
              current = item.get("current", "?")
              comment_lines.append(f"- `{field}`: `{base}` -> `{current}`")

          summary_path = Path("artifacts/baseline_diff_summary.md")
          comment_path = Path("artifacts/baseline_diff_comment.md")
          summary_path.write_text("\n".join(summary_lines).rstrip() + ("\n" if summary_lines else ""), encoding="utf-8")
          comment_path.write_text("\n".join(comment_lines).rstrip() + ("\n" if comment_lines else ""), encoding="utf-8")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
            fh.write(f"mode={mode}\n")
            fh.write(f"regressions={regressions}\n")
            fh.write(f"improvements={improvements}\n")
            fh.write(f"changed={changed}\n")
            fh.write(f"informational={informational}\n")
          PY

      - name: Baseline diff delta to Step Summary (Linux)
        if: always() && runner.os != 'Windows' && steps.baseline_diff_insights.outputs.mode == 'delta'
        shell: bash
        run: |
          cat artifacts/baseline_diff_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing baseline diff comment
        id: find_baseline_diff_comment
        if: always() && github.event_name == 'pull_request' && runner.os != 'Windows'
        continue-on-error: true
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- mesh-baseline-diff -->"

      - name: Upsert baseline diff PR comment
        if: always() && github.event_name == 'pull_request' && runner.os != 'Windows' && steps.baseline_diff_insights.outputs.mode == 'delta'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_baseline_diff_comment.outputs.comment-id }}
          edit-mode: replace
          body-path: artifacts/baseline_diff_comment.md

      - name: Delete baseline diff PR comment when no diffs
        if: always() && github.event_name == 'pull_request' && runner.os != 'Windows' && steps.baseline_diff_insights.outputs.mode == 'none' && steps.find_baseline_diff_comment.outputs.comment-id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${{ steps.find_baseline_diff_comment.outputs.comment-id }}"

      - name: Release notes to Step Summary (Linux)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          echo "## Mesh release notes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/release_notes.md ]; then
            sed -n '1,120p' artifacts/release_notes.md >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "_(release notes unavailable)_" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Release notes to Step Summary (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Mesh release notes"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          if (Test-Path "artifacts/release_notes.md") {
            try {
              Get-Content "artifacts/release_notes.md" | Select-Object -First 120 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            } catch {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "_(release notes unavailable)_"
            }
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "_(release notes unavailable)_"
          }

      - name: Print baseline diff on failure
        if: failure()
        run: |
          python -m mesh_cli artifacts-diff --base tooling/metrics/ci_baseline_artifacts --curr artifacts --format markdown || true

      - name: Print verify diagnostics
        if: failure()
        run: |
          python -m mesh_cli verify-report --artifacts artifacts

      - name: Show artifact index on failure (Linux)
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: |
          echo "=== artifacts/index.json ==="
          if [ -f artifacts/index.json ]; then cat artifacts/index.json; else echo "(missing artifacts/index.json)"; fi

      - name: Show artifact index on failure (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== artifacts/index.json ==="
          if (Test-Path "artifacts/index.json") { Get-Content "artifacts/index.json" } else { Write-Host "(missing artifacts/index.json)" }

      - name: Verify report (head) on failure (Linux)
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: |
          echo "=== verify-report (first 60 lines) ==="
          python -m mesh_cli verify-report --artifacts artifacts | head -n 60 || echo "(verify-report unavailable)"

      - name: Verify report (head) on failure (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== verify-report (first 60 lines) ==="
          try {
            python -m mesh_cli verify-report --artifacts artifacts | Select-Object -First 60
          } catch {
            Write-Host "(verify-report unavailable)"
          }

      - name: Build release bundle (seeded, Windows)
        if: runner.os == 'Windows'
        run: |
          python -m mesh_cli release bundle --out artifacts/release_bundle.zip --seed $env:MESH_CI_SEED

      - name: Build release bundle (seeded, Linux)
        if: runner.os != 'Windows'
        run: |
          xvfb-run -a python -m mesh_cli release bundle --out artifacts/release_bundle.zip --seed $env:MESH_CI_SEED

      - name: Verify release bundle (strict, Windows)
        if: runner.os == 'Windows'
        run: |
          python -m mesh_cli bundle verify --zip artifacts/release_bundle.zip --strict
          python -m mesh_cli bundle verify --zip artifacts/release_bundle.zip --strict --json | Out-File -Encoding utf8 artifacts/bundle_verify_report.json

      - name: Verify release bundle (strict, Linux)
        if: runner.os != 'Windows'
        run: |
          python -m mesh_cli bundle verify --zip artifacts/release_bundle.zip --strict
          python -m mesh_cli bundle verify --zip artifacts/release_bundle.zip --strict --json | Out-File -Encoding utf8 artifacts/bundle_verify_report.json

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-artifacts-${{ matrix.os }}-py${{ matrix.python }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/

  installed:
    # The installed product (H5, #422): this commit's wheel, installed with its declared dependencies into a fresh
    # environment and run from outside the checkout (python -I, no PYTHONPATH or MESH_*): every Mesh module and bundled
    # engine file must come from the installation, and `mesh new` / `mesh doctor` must work. The same file proves the
    # check fails on broken wheels, including one whose missing file the checkout still has. Nothing here installs the
    # checkout, so the test runs without the project's conftest (which imports the checkout's engine).
    name: installed (${{ matrix.os }}, py${{ matrix.python }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            pytest.ini

      - name: Installed-product check
        run: |
          python -m pip install -U pip "pytest>=8.0"
          python -m pytest -o addopts= --noconftest -p no:cacheprovider -q -W error -rA tests/test_wheel_bundles_engine_data.py

  acceptance:
    # Creator-workflow acceptance (H6, #422): save and reopen, new-game isolation, creator field editing and background
    # rendering, in hidden GL windows (`python -m tooling.test_tiers acceptance`, a subset of the gpu lane that
    # extended.yml runs whole). The GL is Mesa's software renderer; the lane fails if any of these GL tests can't run.
    name: acceptance (${{ matrix.os }}, py${{ matrix.python }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      MESH_CI_SEED: "123"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python, the project and a display
        uses: ./.github/actions/mesh-ci-setup
        with:
          python-version: ${{ matrix.python }}

      - name: Creator-workflow acceptance
        run: |
          if ($IsLinux) { xvfb-run -a python -m tooling.test_tiers acceptance }
          else { python -m tooling.test_tiers acceptance }
          if ($LASTEXITCODE -ne 0) { throw "the acceptance lane failed (exit $LASTEXITCODE): see the summary above and the artifact" }

      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-py${{ matrix.python }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/pytest_acceptance*

  tests:
    # The fan-in: one OS's result, green only when its pytest, verify, installed and acceptance jobs all succeeded (failed,
    # cancelled, skipped or missing: red). It always runs once they are done, so it never waits forever, and keeps the check name
    # reviews and merges have always looked at.
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: [pytest, verify, installed, acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Both of this OS's jobs succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/ci_require_jobs.py --os "${{ matrix.os }}" --python "${{ matrix.python }}"

  timing-rolling:
    # Report-only (#373, #400): the integration branch's recent CI timings against the committed advisory model, so a
    # gradual slowdown no per-run rule can see stays visible. Never fails: the job summary, and a warning on a finding.
    name: timing rolling check (report only)
    if: github.event_name == 'push' && github.ref_name == 'redesign/visual-editor'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect recent CI timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tooling/ci_timing_collect.py --branch redesign/visual-editor --runs 30 --out ci_timing

      - name: Rolling check
        run: |
          python tooling/ci_timing_analysis.py --index ci_timing/index.json --durations-dir ci_timing/durations --write-data ci_timing/data.json
          python tooling/ci_timing_analysis.py --data ci_timing/data.json --model tooling/metrics/verify_step_speed_model.json --rolling 24 | tee rolling.md
          cat rolling.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q "PERSISTENT REGRESSION" rolling.md; then
            echo "::warning title=CI timing::persistent slowdown against the advisory model (job summary; #373)"
          fi

  ship:
    name: ship (release branches)
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref_name, 'release/') ||
        (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      MESH_CI_SEED: "123"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            pytest.ini

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run one-command ship
        run: |
          xvfb-run -a python -m mesh_cli release ship --out-dir artifacts/ship --seed $env:MESH_CI_SEED --quiet

      - name: Run replay suite (golden ratchet)
        run: |
          python -m mesh_cli replays run --suite replays/suite.json --out-dir artifacts/replay_suite --seed $env:MESH_CI_SEED --budgets-only-on linux --quiet

      - name: Verify promoted final bundle
        run: |
          python -m mesh_cli bundle verify --zip artifacts/ship/release_final.zip --strict
          python -m mesh_cli bundle verify --zip artifacts/ship/release_final.zip --strict --json | Out-File -Encoding utf8 artifacts/ship/bundle_verify_report.json

      - name: Upload ship artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh_ship_${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/ship/**
            artifacts/replay_suite/**
