[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-engine"
version = "0.5.0"
description = "Mesh Game Engine"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
dependencies = [
    # Runtime line after Arcade 3.x migration.
    "arcade>=3,<4",
    "jsonschema>=4,<5",
    "pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.16",
    "mypy==1.19.1",
    "pygbag==0.9.3",
    "pytest>=8.0",
]
# Optional: enables the Mesh MCP server (engine.mcp_server) so MCP-capable
# AI clients can drive the engine. The engine never hard-requires this; the
# server module imports it behind a guard. Install with: pip install -e .[mcp]
mcp = [
    "mcp>=1.0",
]
# Optional: enables the native in-editor Claude chatbox. The engine imports it
# behind a guard and keeps editor startup safe without this extra. Install with:
# pip install -e .[chat]
chat = [
    # 0.112.0 is the current published SDK; model id and adaptive thinking are API-validated request fields.
    "anthropic>=0.112.0,<1",
]
# Optional: enables local/OpenAI-compatible native chat providers such as
# Ollama's http://localhost:11434/v1 endpoint. Install with:
# pip install -e .[chat-local]
chat-local = [
    # 2.44.0 is the current published SDK and includes Chat Completions streaming/tool calls.
    "openai>=2.44.0,<3",
]

[project.scripts]
mesh = "mesh_cli:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["engine*", "mesh_cli*"]

# Data inside the engine package itself: the JSON schemas every scene, prefab, entity, cutscene and config is
# validated against (engine.schema_validation), and the typing marker.
[tool.setuptools.package-data]
engine = ["schemas/*.json", "py.typed"]

# MANIFEST.in lists the source distribution's data. A wheel only carries files inside packages, so the
# engine's own files a pip-installed Mesh needs (what new projects copy, the HD-2D starter kit, Mesh Studio's
# branding and icons, the launcher's template pictures, the default config and monster data) are installed under
# <prefix>/share/mesh-engine and found by engine.repo_root.bundled_file / bundled_dir.
# An explicit allow-list: only redistributable files, with their licence notices (docs/packaging.md).
# Never add animated_player.png, sproutling.png or shelltide.png: their provenance is unverified.
